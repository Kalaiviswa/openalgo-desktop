name: Download stats

# Counts the downloads of every published release and publishes them to the
# `stats` branch, which holds only the stats files
# (scripts/ci/download_stats.py): badges/*.json, the shields.io endpoint
# badges README.md shows; downloads.csv, one row per day, release and file
# with that day's cumulative count; and a README.md with the tables.
#
# It never commits to master and never edits README.md there. Master is
# fast-forwarded by the landing script, and a bot commit on it would break
# every landing and start a full CI run. The commit is built from the stats
# files alone (git commit-tree), so the master checkout is never changed, and
# pushed to refs/heads/stats only, never forced: a push that would rewrite
# the branch fails instead.
#
# A push made with the GITHUB_TOKEN starts no workflow, and none of the other
# workflows runs on a push to `stats` anyway: ci.yml, codeql.yml,
# native-e2e-test-build.yml and security.yml run on master, release.yml on
# v* tags, the rest on a schedule, by hand or when called.

on:
  schedule:
    - cron: "17 */6 * * *" # every 6 hours
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  count:
    name: count release downloads
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # The script; its token also pushes to the stats branch below.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read the stats branch, if it exists
        env:
          STATS_DIR: ${{ runner.temp }}/stats
        run: |
          set -euo pipefail
          rm -rf "$STATS_DIR"
          mkdir -p "$STATS_DIR"
          found=0
          git ls-remote --exit-code origin refs/heads/stats > /dev/null || found=$?
          case "$found" in
            0)
              git fetch --no-tags --depth=1 origin refs/heads/stats
              git archive FETCH_HEAD | tar -x -C "$STATS_DIR"
              echo "STATS_PARENT=$(git rev-parse FETCH_HEAD)" >> "$GITHUB_ENV"
              ;;
            2) echo "No stats branch yet: the first commit starts it, holding only the stats files." ;;
            *) echo "::error title=Download stats::Could not read the stats branch."; exit 1 ;;
          esac

      - name: Count the downloads
        env:
          GITHUB_TOKEN: ${{ github.token }}
          STATS_DIR: ${{ runner.temp }}/stats
        run: python3 scripts/ci/download_stats.py --repo "$GITHUB_REPOSITORY" --out "$STATS_DIR"

      - name: Commit to the stats branch when something changed
        env:
          STATS_DIR: ${{ runner.temp }}/stats
          GIT_INDEX_FILE: ${{ runner.temp }}/stats.index
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail
          rm -f "$GIT_INDEX_FILE"
          git --work-tree="$STATS_DIR" add -A
          tree=$(git write-tree)
          parent=${STATS_PARENT:-}
          if [ -n "$parent" ] && [ "$tree" = "$(git rev-parse "${parent}^{tree}")" ]; then
            echo "No change since the last count; nothing committed."
            exit 0
          fi
          message="chore(stats): downloads read on $(date -u +%Y-%m-%d)"
          if [ -n "$parent" ]; then
            commit=$(git commit-tree "$tree" -p "$parent" -m "$message")
          else
            commit=$(git commit-tree "$tree" -m "$message")
          fi
          git push origin "${commit}:refs/heads/stats"
